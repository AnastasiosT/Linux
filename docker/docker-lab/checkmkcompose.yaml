services:
  checkmk:
    image: "checkmk/check-mk-enterprise:2.0.0p39"
    container_name: "monitoring"
    environment:
      - CMK_PASSWORD=mypassword
      - TZ=Europe/Berlin
    volumes:
      - monitoring:/omd/sites
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    ports:
      - 8082:5000
      - 8000:8000
    restart: always

volumes:
  monitoring:
