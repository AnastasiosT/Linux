input {

    # nagios history log 
    # reading from stdin is perhaps more handy?
    file {
       type => "nagios"
       path => ["${basedir}/SUP-16932.history.log"]
       start_position => "beginning"
       sincedb_path => "/dev/null"
    }

}

# https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html
filter {

  grok {
    # Elastic Common Schema (ECS)
    patterns_dir => ["${basedir}/logstash-patterns-core/patterns/ecs-v1"]
    #patterns_files_glob => "nagios"

    match => { 
        "message" => [
            "^%{NAGIOSLOGLINE}"
        ]
    }
    add_field => { "serial" => "5" } 
    remove_field => [ "[host][name]" ]
  } # grok

  # https://www.elastic.co/guide/en/logstash/current/plugins-filters-date.html
  # Use the original timestamp as timestamp form the input, not the current time
  date {
      #timezone => "UTC"
      timezone => "Europe/Berlin"
      match => [ "timestamp", "UNIX" ]
  } # date

} # filter

# https://www.elastic.co/guide/en/logstash/current/output-plugins.html
output {

    stdout { codec => dots }
    # stdout { codec => json }
    # stdout { codec => rubydebug }

    # we could not parse
    if "_grokparsefailure" in [tags] {
        file { path => "${basedir}/SUP-16932.history.failed.txt" }
        #stdout { codec => json }
    } else {
    
        elasticsearch { 
            hosts => [ "localhost:9200" ]
            manage_template => false
            index => "aldinord_fr_tou"
            #index => "%{[some_field][sub_field]}-%{+YYYY.MM.dd}"
            #index => "logstash-%{+YYYY.MM.dd}"
            #index => "%{[@metadata][beat]}-%{+YYYY.MM.dd}"
        } # elasticsearch

    } # if

} # output
