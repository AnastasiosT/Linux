global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
   - static_configs:
     - targets:
        - 172.20.0.2:9093
        #ip address needed here otherwise prometheus won't forward alerts to alertmanager. localhost doesn't work. 
scrape_configs:
 - job_name: prometheus
   static_configs:
    - targets:
       - localhost:9090
 - job_name: node
   static_configs:
    - targets:
       - localhost:910
